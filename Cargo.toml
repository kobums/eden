[package]
name = "terminal"
version = "0.1.3"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
arboard = "3.6.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
fontdue = "0.9.3"
global-hotkey = "0.8.0"
libc = "0.2.186"
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.2.2", features = ["NSData"] }
pollster = "1.0.1"
serde_json = "1.0.151"
sysinfo = "0.39.6"
unicode-width = "0.2.2"
ureq = { version = "3.3.0", features = ["json"] }
wgpu = "30.0.0"
winit = "0.30.13"
